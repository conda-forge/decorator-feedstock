{% set version = "5.3.2" %}

package:
  name: decorator
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/decorator/decorator-{{ version }}.tar.gz
  sha256: d9883f1b8259e3bfc42565d0bc6fdc760012008552aa449f75efd2d48319b82b

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - decorator

about:
  home: https://github.com/micheles/decorator
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: Decorators for Humans

extra:
  recipe-maintainers:
    - msarahan
    - pelson
    - ocefpaf
    - scopatz
